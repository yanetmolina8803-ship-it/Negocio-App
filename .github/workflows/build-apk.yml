
name: Crear APK de Negocio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Buscar proyecto Android
        run: |
          echo "Buscando settings.gradle..."
          find . -name settings.gradle -o -name settings.gradle.kts

          if [ -f settings.gradle ]; then
            echo "Proyecto encontrado en la raiz"
          else
            SETTINGS=$(find . -name settings.gradle -o -name settings.gradle.kts | head -n 1)

            if [ -z "$SETTINGS" ]; then
              echo "ERROR: No se encontro settings.gradle"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$SETTINGS")
            echo "Proyecto encontrado en: $PROJECT_DIR"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Compilar APK
        run: |
          PROJECT_DIR="${PROJECT_DIR:-.}"
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Negocio-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
