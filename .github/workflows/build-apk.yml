
name: Crear APK de Negocio

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer ZIP del proyecto
        run: |
          echo "Buscando archivos ZIP..."
          find . -maxdepth 3 -type f -iname "*.zip"

          while IFS= read -r archivo; do
            echo "Extrayendo: $archivo"
            unzip -o "$archivo" -d .
          done < <(find . -maxdepth 3 -type f -iname "*.zip")

      - name: Encontrar proyecto Android
        run: |
          echo "Buscando settings.gradle..."
          SETTINGS=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
            -not -path "*/.gradle/*" | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: No se encontro settings.gradle"
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: No se encontro app/build.gradle"
            exit 1
          fi

          echo "Proyecto encontrado en: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Negocio-APK
          path: "**/build/outputs/apk/debug/*.apk"
          if-no-files-found: error
