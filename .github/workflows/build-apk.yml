
name: Crear APK de Negocio

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Buscar carpeta del proyecto
        id: proyecto
        shell: bash
        run: |
          ARCHIVO=$(find . -type f -name settings.gradle -not -path '*/.gradle/*' | head -n 1)
          if [ -z "$ARCHIVO" ]; then
            echo "ERROR: No se encontro settings.gradle"
            exit 1
          fi
          CARPETA=$(dirname "$ARCHIVO")
          echo "carpeta=$CARPETA" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $CARPETA"

      - name: Compilar APK
        run: |
          cd "${{ steps.proyecto.outputs.carpeta }}"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Negocio-APK
          path: ${{ steps.proyecto.outputs.carpeta }}/app/build/outputs/apk/debug/app-debug.apk
