
name: Crear APK de Negocio

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extraer y localizar proyecto
        run: |
          if [ ! -f settings.gradle ]; then
            ZIP=$(find . -maxdepth 3 -iname "*.zip" -type f | head -n 1)
            if [ -z "$ZIP" ]; then
              echo "No se encontro el ZIP"
              exit 1
            fi
            mkdir -p extraido
            unzip -o "$ZIP" -d extraido
          fi

          FILE=$(find . -name settings.gradle -not -path './.git/*' | head -n 1)

          if [ -z "$FILE" ]; then
            echo "No se encontro settings.gradle"
            exit 1
          fi

          echo "PROJECT_DIR=$(dirname "$FILE")" >> $GITHUB_ENV

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/Negocio.apk"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Negocio-APK
          path: Negocio.apk
