
name: Crear APK de Negocio

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Buscar proyecto Android
        id: proyecto
        shell: bash
        run: |
          echo "Buscando settings.gradle..."

          ARCHIVO=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' | head -n 1)

          if [ -z "$ARCHIVO" ]; then
            echo "No se encontro el proyecto. Buscando archivos ZIP..."
            mkdir -p "$RUNNER_TEMP/proyecto"

            while IFS= read -r ZIP; do
              echo "Extrayendo: $ZIP"
              unzip -oq "$ZIP" -d "$RUNNER_TEMP/proyecto"
            done < <(find . -type f -iname '*.zip')

            ARCHIVO=$(find "$RUNNER_TEMP/proyecto" -type f \( -name settings.gradle -o -name settings.gradle.kts \) -not -path '*/.gradle/*' | head -n 1)
          fi

          if [ -z "$ARCHIVO" ]; then
            echo "ERROR: No se encontro settings.gradle ni dentro de los ZIP."
            echo "Archivos disponibles:"
            find . -maxdepth 3 -type f | head -n 80
            exit 1
          fi

          CARPETA=$(dirname "$ARCHIVO")
          echo "Proyecto encontrado en: $CARPETA"
          echo "carpeta=$CARPETA" >> "$GITHUB_OUTPUT"

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: |
          cd "${{ steps.proyecto.outputs.carpeta }}"
          gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Negocio-APK
          path: ${{ steps.proyecto.outputs.carpeta }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
